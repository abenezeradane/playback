[package]
name = "playback"
version = "0.64.0"
description = "A fully featured video player built with Tauri 2.0"
authors = ["Playback"]
edition = "2021"
rust-version = "1.77.2"

# The library is what mobile/desktop entry points share.
[lib]
name = "playback_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# img-002 adds "image-png": tauri::image::Image::from_bytes decodes the PNG the
# WebView sends for a clipboard copy. Without it Image can only take raw RGBA,
# which is what made the copy cross the IPC bridge as 38 million JSON numbers.
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# gallery-004: archives browsed as directories. `zip` is pure Rust. Default
# features are OFF deliberately — they pull in bzip2/zstd/lzma codecs that comic
# and photo archives never use, and this profile is opt-level = "s". An archive
# using an excluded codec fails with an honest error rather than silently.
zip = { version = "2", default-features = false, features = ["deflate"] }
# RAR/CBR. Builds the UnRAR C source with `cc`. Its licence permits use for
# DECOMPRESSION and forbids reusing the source to build a RAR compressor; this
# crate only ever decompresses.
unrar = "0.5"
# native-001: the embedded-libmpv playback engine. libmpv-2.dll is loaded at
# RUNTIME (never linked) so a missing DLL degrades to the WebView engine instead
# of failing process start.
libloading = "0.8"
# img-002: the clipboard write happens in RUST, through this plugin's ClipboardExt
# trait — the JS side of the plugin is deliberately not installed and the WebView
# is granted no clipboard permission, so nothing in the page can read or write
# the user's clipboard. Only copy_image_to_clipboard can, and only a picture.
tauri-plugin-clipboard-manager = "2"
kamadak-exif = "0.6"
# tags-001: the tag index. SQLite is compiled INTO the exe (`bundled`), so there
# is no runtime DLL and no system dependency; the build already compiles C source
# for unrar, so this needs no toolchain that was not already required. Every
# statement lives in tags.rs — tauri-plugin-sql is deliberately NOT used, because
# it would hand the WebView an arbitrary-SQL bridge.
rusqlite = { version = "0.32", features = ["bundled"] }
# perf-008: a still photo's thumbnail is decoded and downscaled IN PROCESS
# rather than by spawning the 99 MB ffmpeg sidecar once per picture. Measured on
# a 600-photo folder, that spawn cost ~60 ms a call at four concurrent — 33.9 s
# of native work and 600 process spawns — which is what made browsing a large
# gallery slow the whole app down. Default features are OFF deliberately: they
# pull in codecs a photo gallery never shows (exr/hdr/dds/tga/pnm/qoi/tiff) and
# this profile is opt-level = "s". AVIF is NOT enabled — its decoder wants a C
# toolchain (dav1d) — so an AVIF still takes the ffmpeg path, as does any file
# this crate declines to decode.
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
# img-003: the app's only deletion primitive. Files go to the Windows Recycle
# Bin, never to fs::remove_file — see recycle.rs for why that is load-bearing.
# Pinned to 5.2.3, NOT latest: 5.2.6 requires rustc 1.85 and this crate declares
# rust-version = "1.77.2". Default features are REQUIRED: trash::delete does not
# compile on Windows without them — the crate refuses to build unless one of
# coinit_apartmentthreaded/coinit_multithreaded is picked, and that feature is
# only reachable through the default set, which also pulls in `chrono` (used
# for trash LISTING and RESTORE timestamps, neither of which this app exposes).
trash = "5.2.3"

[target.'cfg(windows)'.dependencies]
# Child-window z-order management for the mpv wid embed (push mpv's child HWND
# below WebView2's so the web chrome composites above the video).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
