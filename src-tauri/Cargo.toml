[package]
name = "playback"
version = "0.27.0"
description = "A fully featured video player built with Tauri 2.0"
authors = ["Playback"]
edition = "2021"
rust-version = "1.77.2"

# The library is what mobile/desktop entry points share.
[lib]
name = "playback_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
