[package]
name = "tauri-plugin-playback-host"
version = "0.1.0"
description = "Playback's Android host: All-files access, storage volumes, task control, safe-area insets (android-001)"
edition = "2021"
rust-version = "1.77.2"
publish = false
links = "tauri-plugin-playback-host"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
